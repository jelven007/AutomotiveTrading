name: quant-trading-saas

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: qt_platform
      MYSQL_USER: ${MYSQL_USER:-qt_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${QT_BIND_HOST:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  database-init:
    image: mysql:8.4
    entrypoint: ["/bin/sh", "/ensure-databases.sh"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER:-qt_app}
    volumes:
      - ./mysql/ensure-databases.sh:/ensure-databases.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  identity-migrate:
    build:
      context: ../../services/identity-tenant
    image: qt/identity-tenant:latest
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-qt_app}:${MYSQL_PASSWORD}@mysql:3306/qt_identity
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_TOTP_ENCRYPTION_KEY: ${AUTH_TOTP_ENCRYPTION_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SINGLE_OWNER_MODE: ${SINGLE_OWNER_MODE:-true}
    depends_on:
      database-init:
        condition: service_completed_successfully
    restart: "no"

  identity-tenant:
    image: qt/identity-tenant:latest
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-qt_app}:${MYSQL_PASSWORD}@mysql:3306/qt_identity
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_TOTP_ENCRYPTION_KEY: ${AUTH_TOTP_ENCRYPTION_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SINGLE_OWNER_MODE: ${SINGLE_OWNER_MODE:-true}
    ports:
      - "${QT_BIND_HOST:-127.0.0.1}:${IDENTITY_PORT:-8001}:8000"
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  trading-migrate:
    build:
      context: ../../services/trading
    image: qt/trading:latest
    command: ["alembic", "upgrade", "head"]
    environment: &trading-environment
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-qt_app}:${MYSQL_PASSWORD}@mysql:3306/qt_trading
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      BINANCE_CREDENTIAL_MASTER_KEY_FILE: /opt/quant-trading/secrets/credential-master-key
      BINANCE_ENVIRONMENT: ${BINANCE_ENVIRONMENT:-demo}
      DEMO_TRADING_ENABLED: ${DEMO_TRADING_ENABLED:-false}
    volumes:
      - ${BINANCE_CREDENTIAL_MASTER_KEY_FILE:-/opt/quant-trading/secrets/credential-master-key}:/opt/quant-trading/secrets/credential-master-key:ro
    depends_on:
      database-init:
        condition: service_completed_successfully
    restart: "no"

  trading:
    image: qt/trading:latest
    environment: *trading-environment
    volumes:
      - ${BINANCE_CREDENTIAL_MASTER_KEY_FILE:-/opt/quant-trading/secrets/credential-master-key}:/opt/quant-trading/secrets/credential-master-key:ro
    ports:
      - "${QT_BIND_HOST:-127.0.0.1}:${TRADING_PORT:-8004}:8000"
    depends_on:
      trading-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: qt/web:latest
    ports:
      - "${WEB_BIND_HOST:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    depends_on:
      identity-tenant:
        condition: service_healthy
      trading:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
