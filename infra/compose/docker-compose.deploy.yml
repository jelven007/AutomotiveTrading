name: quant-trading-saas

# 云端单机一键部署编排：默认追加 Web 和 3 个业务服务；币安只读链路使用可选 Profile。
# 依赖组件（mysql/redis/kafka/minio/mailpit）复用基础 docker-compose.yml，
# 通过 `-f docker-compose.yml -f docker-compose.deploy.yml` 叠加启动。
#
# 每个业务服务分两段：
#   1) *-migrate：一次性容器，复用同一镜像执行 `alembic upgrade head` 建表；
#   2) 服务本体：迁移成功后再启动，避免"表还没建好就对外服务"。
# 密钥统一由 .env.deploy 注入，绝不写死在文件里。

services:
  # 身份与租户服务：迁移
  identity-migrate:
    build:
      context: ../../services/identity-tenant
    image: qt/identity-tenant:latest
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-qt_app}:${MYSQL_PASSWORD}@mysql:3306/qt_identity
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_TOTP_ENCRYPTION_KEY: ${AUTH_TOTP_ENCRYPTION_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  # 身份与租户服务：本体
  identity-tenant:
    image: qt/identity-tenant:latest
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-qt_app}:${MYSQL_PASSWORD}@mysql:3306/qt_identity
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_TOTP_ENCRYPTION_KEY: ${AUTH_TOTP_ENCRYPTION_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "${QT_BIND_HOST:-127.0.0.1}:${IDENTITY_PORT:-8001}:8000"
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # 审计服务：迁移
  audit-migrate:
    build:
      context: ../../services/audit
    image: qt/audit:latest
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-qt_app}:${MYSQL_PASSWORD}@mysql:3306/qt_audit
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  # 审计服务：本体
  audit:
    image: qt/audit:latest
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-qt_app}:${MYSQL_PASSWORD}@mysql:3306/qt_audit
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "${QT_BIND_HOST:-127.0.0.1}:${AUDIT_PORT:-8002}:8000"
    depends_on:
      audit-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # 模型配置服务：迁移
  model-config-migrate:
    build:
      context: ../../services/model-config
    image: qt/model-config:latest
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-qt_app}:${MYSQL_PASSWORD}@mysql:3306/qt_model_config
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  # 模型配置服务：本体
  model-config:
    image: qt/model-config:latest
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-qt_app}:${MYSQL_PASSWORD}@mysql:3306/qt_model_config
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "${QT_BIND_HOST:-127.0.0.1}:${MODEL_CONFIG_PORT:-8003}:8000"
    depends_on:
      model-config-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # 币安只读 UAT 使用显式 Profile，不影响默认演示环境。
  readonly-databases-init:
    profiles: ["binance-readonly"]
    image: mysql:8.4
    entrypoint: ["/bin/sh", "/ensure-readonly-databases.sh"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER:-qt_app}
    volumes:
      - ./mysql/ensure-readonly-databases.sh:/ensure-readonly-databases.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  kms-adapter-migrate:
    profiles: ["binance-readonly"]
    build:
      context: ../../services/kms-adapter
    image: qt/kms-adapter:latest
    command: ["alembic", "upgrade", "head"]
    environment:
      ENVIRONMENT: uat
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-qt_app}:${MYSQL_PASSWORD}@mysql:3306/qt_kms
      SERVICE_TOKEN: ${KMS_SERVICE_TOKEN}
      KMS_KEY_ID: ${KMS_KEY_ID}
      KMS_REGION: ${KMS_REGION:-cn-beijing}
      VOLCENGINE_ACCESS_KEY: ${VOLCENGINE_ACCESS_KEY}
      VOLCENGINE_SECRET_KEY: ${VOLCENGINE_SECRET_KEY}
      VOLCENGINE_SESSION_TOKEN: ${VOLCENGINE_SESSION_TOKEN:-}
    depends_on:
      readonly-databases-init:
        condition: service_completed_successfully
    restart: "no"

  kms-adapter:
    profiles: ["binance-readonly"]
    image: qt/kms-adapter:latest
    environment:
      ENVIRONMENT: uat
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-qt_app}:${MYSQL_PASSWORD}@mysql:3306/qt_kms
      SERVICE_TOKEN: ${KMS_SERVICE_TOKEN}
      KMS_KEY_ID: ${KMS_KEY_ID}
      KMS_REGION: ${KMS_REGION:-cn-beijing}
      VOLCENGINE_ACCESS_KEY: ${VOLCENGINE_ACCESS_KEY}
      VOLCENGINE_SECRET_KEY: ${VOLCENGINE_SECRET_KEY}
      VOLCENGINE_SESSION_TOKEN: ${VOLCENGINE_SESSION_TOKEN:-}
    ports:
      - "${QT_BIND_HOST:-127.0.0.1}:${KMS_ADAPTER_PORT:-8006}:8000"
    depends_on:
      kms-adapter-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  risk-migrate:
    profiles: ["binance-readonly"]
    build:
      context: ../../services/risk
    image: qt/risk:latest
    command: ["alembic", "upgrade", "head"]
    environment:
      ENVIRONMENT: uat
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-qt_app}:${MYSQL_PASSWORD}@mysql:3306/qt_risk
      SERVICE_TOKEN: ${RISK_SERVICE_TOKEN}
    depends_on:
      readonly-databases-init:
        condition: service_completed_successfully
    restart: "no"

  risk:
    profiles: ["binance-readonly"]
    image: qt/risk:latest
    environment:
      ENVIRONMENT: uat
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-qt_app}:${MYSQL_PASSWORD}@mysql:3306/qt_risk
      SERVICE_TOKEN: ${RISK_SERVICE_TOKEN}
    ports:
      - "${QT_BIND_HOST:-127.0.0.1}:${RISK_PORT:-8005}:8000"
    depends_on:
      risk-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  trading-migrate:
    profiles: ["binance-readonly"]
    build:
      context: ../../services/trading
    image: qt/trading:latest
    command: ["alembic", "upgrade", "head"]
    environment:
      ENVIRONMENT: uat
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-qt_app}:${MYSQL_PASSWORD}@mysql:3306/qt_trading
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      SECRET_BACKEND: kms
      KMS_URL: http://kms-adapter:8000
      KMS_SERVICE_TOKEN: ${KMS_SERVICE_TOKEN}
      RISK_SERVICE_URL: http://risk:8000
      RISK_SERVICE_TOKEN: ${RISK_SERVICE_TOKEN}
      ALLOW_INSECURE_INTERNAL_HTTP: "true"
      LIVE_TRADING_ENABLED: "false"
      FIXED_EGRESS_IP_CONFIGURED: ${FIXED_EGRESS_IP_CONFIGURED:-false}
    depends_on:
      readonly-databases-init:
        condition: service_completed_successfully
    restart: "no"

  trading:
    profiles: ["binance-readonly"]
    image: qt/trading:latest
    environment:
      ENVIRONMENT: uat
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-qt_app}:${MYSQL_PASSWORD}@mysql:3306/qt_trading
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      SECRET_BACKEND: kms
      KMS_URL: http://kms-adapter:8000
      KMS_SERVICE_TOKEN: ${KMS_SERVICE_TOKEN}
      RISK_SERVICE_URL: http://risk:8000
      RISK_SERVICE_TOKEN: ${RISK_SERVICE_TOKEN}
      ALLOW_INSECURE_INTERNAL_HTTP: "true"
      LIVE_TRADING_ENABLED: "false"
      FIXED_EGRESS_IP_CONFIGURED: ${FIXED_EGRESS_IP_CONFIGURED:-false}
    ports:
      - "${QT_BIND_HOST:-127.0.0.1}:${TRADING_PORT:-8004}:8000"
    depends_on:
      trading-migrate:
        condition: service_completed_successfully
      kms-adapter:
        condition: service_healthy
      risk:
        condition: service_healthy
    restart: unless-stopped

  instrument-market-migrate:
    build:
      context: ../../services/instrument-market
    image: qt/instrument-market:latest
    command: ["alembic", "upgrade", "head"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-qt_app}:${MYSQL_PASSWORD}@mysql:3306/qt_market
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  instrument-market:
    image: qt/instrument-market:latest
    environment:
      ENVIRONMENT: production
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-qt_app}:${MYSQL_PASSWORD}@mysql:3306/qt_market
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-qt_market}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-qt_market}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: market-raw
      INGEST_SERVICE_TOKEN: ${MARKET_INGEST_SERVICE_TOKEN:-}
      MOOTDX_SOURCE_ID: ${MOOTDX_SOURCE_ID:-tdx-auto}
      TDX_DATA_PATH: ${TDX_DATA_PATH:-}
      WAL_PATH: /app/data/wal
      QUOTE_SHARD_COUNT: ${QUOTE_SHARD_COUNT:-8}
      QUOTE_SWEEP_SECONDS: ${QUOTE_SWEEP_SECONDS:-2}
      QUOTE_STALE_AFTER_SECONDS: 3
    ports:
      - "${QT_BIND_HOST:-127.0.0.1}:${INSTRUMENT_MARKET_PORT:-8007}:8000"
    volumes:
      - instrument-market-wal:/app/data/wal
    depends_on:
      instrument-market-migrate:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  mootdx-collector:
    build:
      context: ../../services/mootdx-collector
    image: qt/mootdx-collector:latest
    environment:
      COLLECTOR_CORE_URL: http://instrument-market:8000
      MARKET_INGEST_SERVICE_TOKEN: ${MARKET_INGEST_SERVICE_TOKEN:-}
      COLLECTOR_SPOOL_PATH: /data/collector.sqlite3
      COLLECTOR_WORKERS: ${QUOTE_SHARD_COUNT:-8}
      COLLECTOR_SWEEP_SECONDS: ${QUOTE_SWEEP_SECONDS:-2}
      COLLECTOR_CLOSED_SECONDS: ${COLLECTOR_CLOSED_SECONDS:-300}
      COLLECTOR_ENDPOINTS: ${COLLECTOR_ENDPOINTS:-}
      COLLECTOR_MAX_PENDING: ${COLLECTOR_MAX_PENDING:-10000}
      COLLECTOR_MAX_SPOOL_BYTES: ${COLLECTOR_MAX_SPOOL_BYTES:-10737418240}
      COLLECTOR_HISTORY_ENABLED: ${COLLECTOR_HISTORY_ENABLED:-true}
      COLLECTOR_HISTORY_REQUEST_INTERVAL: ${COLLECTOR_HISTORY_REQUEST_INTERVAL:-0.25}
      COLLECTOR_HISTORY_BAR_COUNT: ${COLLECTOR_HISTORY_BAR_COUNT:-800}
      COLLECTOR_HISTORY_TRANSACTION_PAGE_SIZE: ${COLLECTOR_HISTORY_TRANSACTION_PAGE_SIZE:-800}
      COLLECTOR_HISTORY_TRANSACTION_MAX_PAGES: ${COLLECTOR_HISTORY_TRANSACTION_MAX_PAGES:-8}
    volumes:
      - mootdx-collector-data:/data
    ports:
      - "127.0.0.1:${MOOTDX_COLLECTOR_PORT:-8010}:8010"
    depends_on:
      instrument-market:
        condition: service_healthy
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 90s
    restart: unless-stopped

  # Web 是唯一公网入口，同时提供静态页面和同源 API 反向代理。
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: qt/web:latest
    ports:
      - "0.0.0.0:${WEB_PORT:-80}:8080"
    depends_on:
      identity-tenant:
        condition: service_healthy
      audit:
        condition: service_healthy
      model-config:
        condition: service_healthy
      instrument-market:
        condition: service_healthy
    restart: unless-stopped

volumes:
  instrument-market-wal:
  mootdx-collector-data:
