[project]
name = "risk"
version = "0.1.0"
description = "Deterministic pre-trade risk authorization service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "opentelemetry-api>=1.37,<2",
  "opentelemetry-instrumentation-fastapi>=0.58b0,<1",
  "opentelemetry-sdk>=1.37,<2",
  "pydantic-settings>=2.10,<3",
  "pymysql>=1.1,<2",
  "sqlalchemy>=2.0,<3",
  "structlog>=25.4,<26",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8.4,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
