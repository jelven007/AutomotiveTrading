[project]
name = "kms-adapter"
version = "0.1.0"
description = "Tenant-isolated envelope encryption broker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=45.0,<47",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "pymysql>=1.1,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
volcengine = [
  "volcengine-python-sdk>=5.0.36,<6",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8.4,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kms_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
