[project]
name = "mootdx-collector"
version = "0.1.0"
description = "Isolated, durable A-share snapshot collector"
requires-python = ">=3.12,<3.13"
dependencies = ["mootdx==0.11.7", "tdxpy==0.2.7", "httpx==0.25.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
