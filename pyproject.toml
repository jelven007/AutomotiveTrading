[project]
name = "quant-trading-saas"
version = "0.1.0"
description = "Minimal Binance account and trading system"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "httpx>=0.28.1,<0.29",
  "mypy>=1.18.2,<2",
  "pre-commit>=4.3.0,<5",
  "pytest>=8.4.2,<9",
  "pytest-asyncio>=1.2.0,<2",
  "pyyaml>=6.0.2,<7",
  "ruff>=0.13.1,<0.14",
]

[tool.uv.workspace]
members = ["services/identity-tenant", "services/trading"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["packages", "services", "scripts/tests", "tests"]
norecursedirs = [".*", "node_modules", "dist", "build"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".git", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
