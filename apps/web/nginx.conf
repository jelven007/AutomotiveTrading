server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # 身份和租户接口由身份服务处理，路径保持不变。
    location ^~ /api/v1/auth/ {
        proxy_pass http://identity-tenant:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/tenants/ {
        proxy_pass http://identity-tenant:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 模型配置页面使用同源 API，避免在前端写入服务器地址。
    location ^~ /api/v1/tenant/model-configurations {
        proxy_pass http://model-config:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A 股主数据、行情查询和数据运维接口。
    location ^~ /api/v1/market {
        proxy_pass http://instrument-market:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Trading 是可选 UAT Profile，延迟解析避免默认部署因服务未启动而失败。
    location ^~ /api/v1/trading {
        set $trading_upstream trading:8000;
        proxy_pass http://$trading_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        default_type application/json;
        return 404 '{"code":"route.not_found","message":"API route not found"}';
    }

    location ~* \.(?:css|js|ico|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router 的深层链接刷新时回退到入口文件。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
